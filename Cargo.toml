[package]
name = "sinonome_bouncer"
version = "0.2.1"
edition = "2021"

[dependencies]
image = "0.25"
rfd = "0.17.2"
winit = "0.30"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
tray-icon = "0.24.2"
windows = { version = "0.62.2", features = [
	"Win32_Foundation",
	"Win32_Graphics_Direct3D",
	"Win32_Graphics_Direct3D11",
	"Win32_Graphics_DirectComposition",
	"Win32_Graphics_Dxgi",
	"Win32_Graphics_Dxgi_Common",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
